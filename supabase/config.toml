project_id = "inmore-ops"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Staff accounts are created by the owner from the dashboard, never self-served.
enable_signup = false

[auth.email]
# CAREFUL: this one maps to GOTRUE_EXTERNAL_EMAIL_ENABLED — it turns the
# email/password provider ON OR OFF ENTIRELY, it does not mean "may strangers
# register". Setting it false makes every sign-in fail with "Email logins are
# disabled", including the owner's.
#
# Self-registration is blocked by `enable_signup = false` in the [auth] section
# above, which maps to GOTRUE_DISABLE_SIGNUP. That is the one we want off.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
