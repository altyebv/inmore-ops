name: inmore_core
description: Shared domain models, enums, repositories and providers for the Inmore ops system.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# NOTE: freezed / json_serializable are the decided approach for models
# (blueprint §F) but are deliberately not wired up yet. Step 0 has exactly one
# model; pulling in build_runner for it would add a codegen step before there is
# anything to generate. They come in with step 1, when Customer, Request and
# RequestItem arrive together and hand-written fromJson stops being free.
