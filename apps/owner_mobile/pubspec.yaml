name: owner_mobile
description: Inmore — the owner's view of what is happening.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  inmore_core:
    path: ../../packages/inmore_core
  inmore_ui:
    path: ../../packages/inmore_ui
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ">=2.4.4 <2.4.6" # newer needs archive 4, which excel 4.0.6 cannot use

flutter:
  uses-material-design: true

# Launcher icon and splash. Regenerate after changing the logo:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../docs/brand/icon.png
  adaptive_icon_background: "#17181B"
  adaptive_icon_foreground: ../../docs/brand/icon_foreground.png
  adaptive_icon_monochrome: ../../docs/brand/icon_foreground.png
  web:
    generate: true
    image_path: ../../docs/brand/icon.png
    background_color: "#17181B"
    theme_color: "#17181B"

flutter_native_splash:
  color: "#F6F6F4"
  image: ../../docs/brand/splash_light.png
  color_dark: "#121315"
  image_dark: ../../docs/brand/splash_dark.png
  android_12:
    color: "#F6F6F4"
    image: ../../docs/brand/splash_android12_light.png
    color_dark: "#121315"
    image_dark: ../../docs/brand/splash_android12_dark.png
  ios: false
  web: false
